# Thirty-repository planning takes 15 s or more per test on a CI runner, so only CI runs it.
[profile.default]
default-filter = """
not (
    test(=model::tests::uncapped_thirty_repository_history_has_no_silent_fades)
  | test(=model::windows::tests::thirty_repositories_stitch_with_capped_travel)
  | test(=model::slots::tests::realistic_thirty_repository_slots_sample_every_commit_and_replay)
  | test(=model::treemap::tests::realistic_thirty_repository_history_fills_every_live_tick_and_replays)
)
"""
slow-timeout = { period = "30s", terminate-after = 2 }

[profile.ci]
default-filter = "all()"
slow-timeout = { period = "60s", terminate-after = 3 }
