name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install prek
        run: uv tool install prek==0.5.7
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          run-install: false
      - name: Run lint hooks
        env:
          SKIP: no-commit-to-branch,cargo-fmt,clippy-enforce
          GITHUB_TOKEN: ${{ github.token }}
        run: prek run --all-files

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify Rust inputs
        id: changes
        shell: bash
        run: |
          rust=$(bash scripts/ci_rust.sh)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.rust == 'true'
        run: rustup show
      - name: Restore Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Check formatting
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: Check Clippy warnings
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Run tests
        if: steps.changes.outputs.rust == 'true'
        run: cargo test --locked --all-targets --all-features
