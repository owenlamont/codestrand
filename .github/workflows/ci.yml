name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  render-export:
    name: Render export (lavapipe)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WGPU_BACKEND: vulkan
      WGPU_ADAPTER_NAME: llvmpipe
      CARGO_BUILD_JOBS: 2
      CODESTRAND_REQUIRE_SYSTEM_FONTS: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify Rust inputs
        id: changes
        run: |
          rust=$(bash scripts/ci_rust.sh)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - name: Install Mesa lavapipe
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y mesa-vulkan-drivers libvulkan1 vulkan-tools \
            fonts-noto-core fonts-noto-cjk libwayland-dev libxkbcommon-dev strace
      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.rust == 'true'
        run: rustup show
      - name: Install uv
        if: steps.changes.outputs.rust == 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Restore Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: render-export
      - name: Check the dependency graph has one network client
        if: steps.changes.outputs.rust == 'true'
        run: uv run --script scripts/check_dependency_graph.py
      - name: Run graphics export tests
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 35
        run: |
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#icds[@]}" -eq 1
          test -f "${icds[0]}"
          export VK_DRIVER_FILES="${icds[0]}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          mkdir -m 700 "$XDG_RUNTIME_DIR"
          vulkaninfo --summary
          cargo test --locked --test render_export -- --ignored
      - name: Export with no network, tracing socket calls
        if: steps.changes.outputs.rust == 'true'
        timeout-minutes: 10
        run: |
          # Ubuntu's AppArmor policy otherwise blocks unprivileged user namespaces.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          export VK_DRIVER_FILES="${icds[0]}"
          export XDG_RUNTIME_DIR="$RUNNER_TEMP/xdg-runtime"
          export XDG_CACHE_HOME="$RUNNER_TEMP/traced-cache"
          repository="$RUNNER_TEMP/traced-repository"
          git init --quiet --initial-branch=main "$repository"
          for text in one two; do
            echo "$text" >> "$repository/notes.txt"
            git -C "$repository" add notes.txt
            git -C "$repository" -c user.name=CI -c user.email=ci@example.invalid               commit --quiet --message "$text"
          done
          output="$RUNNER_TEMP/traced-export"
          uv run --script scripts/trace_network.py -- target/debug/codestrand export             "$output" --repository "$repository" --frames 2 --fps 2 --resolution 320x180
          test -s "$output/frame-00001.png"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      CODESTRAND_REQUIRE_SYSTEM_FONTS: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify Rust inputs
        id: changes
        run: |
          rust=$(bash scripts/ci_rust.sh)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain and LLVM tools
        if: steps.changes.outputs.rust == 'true'
        run: |
          rustup show
          rustup component add llvm-tools-preview
      - name: Install Linux build dependencies and script fonts
        if: steps.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-core fonts-noto-cjk             libwayland-dev libxkbcommon-dev
      - name: Restore Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
        with:
          shared-key: coverage
      - name: Install cargo-nextest and cargo-llvm-cov
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest,cargo-llvm-cov
      - name: Report test coverage
        if: steps.changes.outputs.rust == 'true'
        shell: bash
        run: |
          cargo llvm-cov clean --workspace
          cargo llvm-cov nextest --locked --all-targets --all-features --no-report
          {
            echo '### Test coverage (nextest + cargo-llvm-cov)'
            echo
            echo '```text'
            cargo llvm-cov report --summary-only
            echo '```'
          } > coverage.md
          cat coverage.md
          cat coverage.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        if: steps.changes.outputs.rust == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage
          path: coverage.md

  coverage-comment:
    name: Coverage comment
    needs: coverage
    if: >-
      ${{ github.event_name == 'pull_request' && !cancelled()
      && !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Download coverage report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: coverage
        continue-on-error: true
      - name: Comment coverage summary on the pull request
        if: hashFiles('coverage.md') != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: codestrand-coverage
          path: coverage.md

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2
      - name: Install prek
        run: uv tool install prek==0.5.7
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          run-install: false
      - name: Run lint hooks
        env:
          SKIP: no-commit-to-branch,cargo-fmt,clippy-enforce,dependency-graph
          GITHUB_TOKEN: ${{ github.token }}
        run: prek run --all-files
      - name: Validate the agent skill
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CODESTRAND_REQUIRE_SYSTEM_FONTS: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Classify Rust inputs
        id: changes
        shell: bash
        run: |
          rust=$(bash scripts/ci_rust.sh)
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
      - name: Install pinned Rust toolchain
        if: steps.changes.outputs.rust == 'true'
        run: rustup show
      - name: Install Linux build dependencies and script fonts
        if: steps.changes.outputs.rust == 'true' && runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y fonts-noto-core fonts-noto-cjk \
            libwayland-dev libxkbcommon-dev
      - name: Restore Cargo cache
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0  # v2.9.3
      - name: Check formatting
        if: steps.changes.outputs.rust == 'true'
        run: cargo fmt --all -- --check
      - name: Check Clippy warnings
        if: steps.changes.outputs.rust == 'true'
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Install cargo-nextest
        if: steps.changes.outputs.rust == 'true'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39
        with:
          tool: cargo-nextest
      - name: Run tests
        if: steps.changes.outputs.rust == 'true'
        run: cargo nextest run --locked --all-targets --all-features
