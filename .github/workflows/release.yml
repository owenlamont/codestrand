name: Release

on:
  push:
    tags: [v*]
  workflow_dispatch:
    inputs:
      publish:
        description: >-
          Publish to PyPI, crates.io and npm. Only publishes when dispatched on a v* tag ref.
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - id: version
        name: Verify package and tag versions
        run: |
          python - <<'PY'
          import json
          import os
          import tomllib
          from pathlib import Path

          cargo = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          python = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          npm = json.loads(Path("package.json").read_text())["version"]
          assert cargo == python == npm, "Cargo, Python and npm versions differ"
          if os.environ["GITHUB_REF"].startswith("refs/tags/"):
              assert os.environ["GITHUB_REF_NAME"] == f"v{cargo}", "Tag version differs"
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={cargo}\n")
          PY
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          save-cache: false
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          run-install: false
      - name: Verify third-party notices
        run: uv run --script scripts/licenses.py --check
      - name: Verify changelog section
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --script scripts/changelog.py extract "v${VERSION}"

  preflight-release-guard:
    name: Preflight release guard
    needs: [version-check]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Ensure existing release (if any) is a draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          release_query_err_file="$(mktemp)"
          if release_is_draft="$(gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>"${release_query_err_file}")"; then
            :
          elif grep -Eq '404|not[[:space:]]+found' "${release_query_err_file}"; then
            echo "No release exists for ${RELEASE_TAG}; continuing."
            exit 0
          else
            echo "Failed to query release ${RELEASE_TAG}." >&2
            cat "${release_query_err_file}" >&2
            exit 1
          fi
          if [ "${release_is_draft}" = "true" ]; then
            echo "Draft release ${RELEASE_TAG} already exists; continuing for rerun safety."
            exit 0
          fi
          echo "Published release ${RELEASE_TAG} already exists; refusing to continue." >&2
          exit 1

  wheels:
    needs: version-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-latest
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheel
        id: build
        continue-on-error: true
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: '2_28'
          before-script-linux: >-
            dnf install -y alsa-lib-devel systemd-devel libX11-devel
            libXcursor-devel libXi-devel libXrandr-devel libxkbcommon-devel
            wayland-devel mesa-libEGL-devel
      - name: Build wheel (retry)
        if: steps.build.outcome == 'failure'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --locked --out dist
          manylinux: '2_28'
          before-script-linux: >-
            dnf install -y alsa-lib-devel systemd-devel libX11-devel
            libXcursor-devel libXi-devel libXrandr-devel libxkbcommon-devel
            wayland-devel mesa-libEGL-devel
      - name: Package standalone binary from wheel
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          python - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          target = os.environ["TARGET"]
          executable = "codestrand.exe" if "windows" in target else "codestrand"
          wheel, = Path("dist").glob("*.whl")
          with zipfile.ZipFile(wheel) as archive:
              member, = (name for name in archive.namelist()
                         if name.endswith(f".data/scripts/{executable}"))
              data = archive.read(member)
          Path("binaries").mkdir()
          with zipfile.ZipFile(f"binaries/codestrand-{target}.zip", "w",
                               zipfile.ZIP_DEFLATED) as archive:
              info = zipfile.ZipInfo(executable)
              info.compress_type = zipfile.ZIP_DEFLATED
              info.create_system = 3
              info.external_attr = 0o100755 << 16
              archive.writestr(info, data)
              for license_path in ("LICENSE", "LICENSE-APACHE",
                                   "assets/material/LICENSE.txt", "THIRDPARTY.txt"):
                  archive.write(license_path, license_path)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist/*.whl
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: binaries-${{ matrix.target }}
          path: binaries/*.zip
          if-no-files-found: error

  sdist:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b  # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  smoke-wheels:
    needs: [wheels, version-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wheels-${{ matrix.target }}
          path: dist
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          save-cache: false
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2t64 libudev1 libxkbcommon0 libwayland-client0 libegl1
      - name: Install wheel and run CLI
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        shell: bash
        run: |
          set -euxo pipefail
          for attempt in 1 2 3; do
            if uv python install 3.15 \
              && uv venv --clear -p 3.15 .venv \
              && uv pip install -p .venv --no-index --find-links dist codestrand \
              && uv run --no-project -p .venv codestrand --help \
              && [ "$(uv run --no-project -p .venv codestrand --version)" = "codestrand ${VERSION}" ]; then
              exit 0
            fi
            echo "Smoke attempt ${attempt} failed; retrying" >&2
            if [ "${attempt}" -lt 3 ]; then sleep 10; fi
          done
          exit 1

  release-assets:
    needs: [wheels, sdist, smoke-wheels]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-assets
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: release-assets
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          path: source
      - name: Stage third-party notices
        run: cp source/THIRDPARTY.txt release-assets/THIRDPARTY.txt
      - name: Generate SHA256SUMS
        working-directory: release-assets
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=(*)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No release archives found to checksum" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error

  draft-github-release:
    name: Draft GitHub release
    needs:
      - release-assets
      - smoke-wheels
      - preflight-release-guard
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
          save-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: Generate release asset attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            release-assets/*.zip
            release-assets/*.whl
            release-assets/*.tar.gz
      - name: Read release notes from changelog
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --script scripts/changelog.py extract "$RELEASE_TAG" > release-notes.md
      - name: Ensure draft tag release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |-
          set -euo pipefail
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "Ref '${GITHUB_REF}' is not a release tag (refs/tags/v*)." >&2
            exit 1
          fi
          release_query_err_file="$(mktemp)"
          if release_is_draft="$(gh release view "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" --json isDraft --jq '.isDraft' 2>"${release_query_err_file}")"; then
            :
          elif grep -Eq '404|not[[:space:]]+found' "${release_query_err_file}"; then
            gh release create "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" --verify-tag --title "${RELEASE_TAG}" --draft --notes-file release-notes.md
            exit 0
          else
            echo "Failed to query release ${RELEASE_TAG}." >&2
            cat "${release_query_err_file}" >&2
            exit 1
          fi
          if [ "${release_is_draft}" = "true" ]; then
            gh release edit "${RELEASE_TAG}" -R "${GITHUB_REPOSITORY}" --notes-file release-notes.md
            echo "Reusing existing draft release ${RELEASE_TAG}."
            exit 0
          fi
          echo "Published release ${RELEASE_TAG} already exists; refusing to continue." >&2
          exit 1
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release upload "$RELEASE_TAG" -R "${GITHUB_REPOSITORY}" release-assets/* --clobber

  publish-crates:
    needs: [version-check, draft-github-release, smoke-wheels, preflight-release-guard]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether version exists
        id: pending
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -sS -A codestrand-release-workflow \
            -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/codestrand/$VERSION")
          case "$status" in
            200) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io HTTP status: $status" >&2; exit 1 ;;
          esac
      - name: Install Linux dependencies
        if: steps.pending.outputs.publish == 'true'
        run: >-
          sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev
          libx11-dev libxcursor-dev libxi-dev libxrandr-dev libxkbcommon-dev
          libwayland-dev libegl1-mesa-dev
      - name: Authenticate with crates.io
        if: steps.pending.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9  # v1.0.6
      - name: Publish crate
        if: steps.pending.outputs.publish == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked

  publish-pypi:
    needs: [version-check, draft-github-release, smoke-wheels, preflight-release-guard]
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Check whether version exists
        id: pending
        env:
          VERSION: ${{ needs.version-check.outputs.version }}
        run: |
          set -euo pipefail
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            "https://pypi.org/pypi/codestrand/$VERSION/json")
          case "$status" in
            200) echo 'publish=false' >> "$GITHUB_OUTPUT" ;;
            404) echo 'publish=true' >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected PyPI HTTP status: $status" >&2; exit 1 ;;
          esac
      - name: Generate artifact attestation
        if: steps.pending.outputs.publish == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: dist/*
      - name: Publish distributions
        if: steps.pending.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
        with:
          skip-existing: true

  stage_npm_packages:
    name: Stage npm packages
    runs-on: ubuntu-latest
    needs:
      - smoke-wheels
      - preflight-release-guard
      - draft-github-release
      - wheels
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    outputs:
      platform_matrix: ${{ steps.platform_matrix.outputs.value }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: binaries-*
          merge-multiple: true
          path: release-assets
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false
      - name: Build npm package directories
        run: uv run --script scripts/build_npm_packages.py --assets-dir release-assets --out-dir dist/npm
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
      - name: Pack npm packages
        run: |-
          set -euo pipefail
          mkdir -p dist/npm-tarballs
          for package_dir in dist/npm/*; do
            [ -d "${package_dir}" ] || continue
            (
              cd "${package_dir}"
              npm pack --pack-destination "${GITHUB_WORKSPACE}/dist/npm-tarballs"
            )
          done
      - name: Compute npm platform matrix
        id: platform_matrix
        run: |-
          set -euo pipefail
          matrix_json="$(python3 - <<'PY'
          import json
          with open("npm-platforms.json", "r", encoding="utf-8") as handle:
              platforms = json.load(handle)["platforms"]
          matrix = [
              {"folder_name": platform["folderName"], "package_name": platform["packageName"]}
              for platform in platforms
          ]
          print(json.dumps(matrix, separators=(",", ":")))
          PY
          )"
          echo "value=${matrix_json}" >> "${GITHUB_OUTPUT}"
      - name: Upload packed npm packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: npm-packages
          path: dist/npm-tarballs/*.tgz
          if-no-files-found: error

  publish_npm_platforms:
    name: Publish npm platform package
    runs-on: ubuntu-latest
    needs:
      - smoke-wheels
      - preflight-release-guard
      - stage_npm_packages
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.stage_npm_packages.outputs.platform_matrix) }}
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-packages
          path: dist/npm-tarballs
      - name: Verify Node and npm versions for Trusted Publishing
        run: |-
          set -euo pipefail
          node --version
          npm --version
          python - <<'PY'
          import os
          import subprocess
          import sys

          def parse(version: str) -> tuple[int, int, int]:
              version = version.strip().removeprefix("v")
              parts = version.split(".")
              return tuple(int(part) for part in parts[:3])

          node_version = subprocess.check_output(["node", "--version"], text=True).strip()
          npm_version = subprocess.check_output(["npm", "--version"], text=True).strip()
          min_node = (22, 14, 0)
          min_npm = (11, 5, 1)

          if parse(node_version) < min_node:
              print(
                  f"Node {node_version} is too old for npm Trusted Publishing; "
                  f"need >= {'.'.join(map(str, min_node))}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          if parse(npm_version) < min_npm:
              print(
                  f"npm {npm_version} is too old for npm Trusted Publishing; "
                  f"need >= {'.'.join(map(str, min_npm))}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Read package metadata
        id: package_metadata
        env:
          FOLDER_NAME: ${{ matrix.folder_name }}
        run: |-
          set -euo pipefail
          tarball_path=$(find dist/npm-tarballs -maxdepth 1 -type f -name "*${FOLDER_NAME}-*.tgz" | head -n 1)
          [ -n "${tarball_path}" ]
          readarray -t package_metadata < <(python3 - "${tarball_path}" <<'PY'
          import json
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              package_json = json.load(archive.extractfile("package/package.json"))
          print(package_json["name"])
          print(package_json["version"])
          PY
          )
          package_name="${package_metadata[0]}"
          package_version="${package_metadata[1]}"
          {
            echo "name=${package_name}"
            echo "version=${package_version}"
            echo "tarball_path=${tarball_path}"
          } >> "${GITHUB_OUTPUT}"
      - name: Check if NPM version already exists
        id: npm_exists
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.version }}
        run: |-
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "NPM package ${PACKAGE_NAME} ${PACKAGE_VERSION} already published; skipping upload."
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish npm platform package (Trusted Publishing)
        if: steps.npm_exists.outputs.already_published != 'true'
        env:
          TARBALL_PATH: ${{ steps.package_metadata.outputs.tarball_path }}
        run: npm publish --provenance --access public "$TARBALL_PATH"

  publish_npm_meta:
    name: Publish npm meta-package
    runs-on: ubuntu-latest
    needs:
      - smoke-wheels
      - preflight-release-guard
      - stage_npm_packages
      - publish_npm_platforms
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: npm-packages
          path: dist/npm-tarballs
      - name: Verify Node and npm versions for Trusted Publishing
        run: |-
          set -euo pipefail
          node --version
          npm --version
          python - <<'PY'
          import subprocess
          import sys

          def parse(version: str) -> tuple[int, int, int]:
              version = version.strip().removeprefix("v")
              parts = version.split(".")
              return tuple(int(part) for part in parts[:3])

          node_version = subprocess.check_output(["node", "--version"], text=True).strip()
          npm_version = subprocess.check_output(["npm", "--version"], text=True).strip()
          min_node = (22, 14, 0)
          min_npm = (11, 5, 1)

          if parse(node_version) < min_node:
              print(
                  f"Node {node_version} is too old for npm Trusted Publishing; "
                  f"need >= {'.'.join(map(str, min_node))}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          if parse(npm_version) < min_npm:
              print(
                  f"npm {npm_version} is too old for npm Trusted Publishing; "
                  f"need >= {'.'.join(map(str, min_npm))}.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Read package metadata
        id: package_metadata
        run: |-
          set -euo pipefail
          tarball_path="dist/npm-tarballs/owenlamont-codestrand-${GITHUB_REF_NAME#v}.tgz"
          [ -f "${tarball_path}" ]
          readarray -t package_metadata < <(python3 - "${tarball_path}" <<'PY'
          import json
          import sys
          import tarfile

          with tarfile.open(sys.argv[1], "r:gz") as archive:
              package_json = json.load(archive.extractfile("package/package.json"))
          print(package_json["name"])
          print(package_json["version"])
          PY
          )
          package_name="${package_metadata[0]}"
          package_version="${package_metadata[1]}"
          {
            echo "name=${package_name}"
            echo "version=${package_version}"
            echo "tarball_path=${tarball_path}"
          } >> "${GITHUB_OUTPUT}"
      - name: Check if NPM version already exists
        id: npm_exists
        env:
          PACKAGE_NAME: ${{ steps.package_metadata.outputs.name }}
          PACKAGE_VERSION: ${{ steps.package_metadata.outputs.version }}
        run: |-
          set -euo pipefail
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version > /dev/null 2>&1; then
            echo "already_published=true" >> "${GITHUB_OUTPUT}"
            echo "NPM package ${PACKAGE_NAME} ${PACKAGE_VERSION} already published; skipping upload."
          else
            echo "already_published=false" >> "${GITHUB_OUTPUT}"
          fi
      - name: Publish npm meta-package (Trusted Publishing)
        if: steps.npm_exists.outputs.already_published != 'true'
        env:
          TARBALL_PATH: ${{ steps.package_metadata.outputs.tarball_path }}
        run: npm publish --provenance --access public "$TARBALL_PATH"
  finalize-github-release:
    name: Finalize GitHub release
    needs:
      - publish-crates
      - publish-pypi
      - publish_npm_meta
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish == true))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit "$RELEASE_TAG" -R "${GITHUB_REPOSITORY}" --draft=false
