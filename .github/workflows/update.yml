name: Update Dependencies and Linters
on:
  schedule:
    - cron: '30 8 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh-dependencies-and-linters:
    runs-on: ubuntu-latest
    environment: automation
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Update Rust dependencies
        run: cargo update

      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e  # v0.11.3
        with:
          run-install: false

      - name: Refresh third-party notices
        run: uv run --script scripts/licenses.py

      - name: Install prek
        run: uv tool install prek==0.5.7

      - name: Run prek autoupdate
        run: prek autoupdate --cooldown-days 7

      - name: Check for changes
        id: check_diff
        run: |-
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate token
        if: steps.check_diff.outputs.changed == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        id: generate-token
        with:
          client-id: ${{ secrets.AUTH_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR with updated deps and linters
        if: steps.check_diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8
        with:
          token: ${{ steps.generate-token.outputs.token }}
          commit-message: 'chore: refresh dependencies and linters'
          title: 'chore: refresh dependencies and linters'
          body: |-
            Automated dependency and linter refresh:
            - Ran `cargo update`
            - Regenerated `THIRDPARTY.txt`
            - Ran `prek autoupdate --cooldown-days 7`
          branch: bot/update-deps-and-linters
          author: GitHub Actions <actions@github.com>
          delete-branch: true
