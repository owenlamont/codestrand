version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: friday

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
  - package-ecosystem: cargo
    directory: /
    patterns:
      - '*'
    multi-ecosystem-group: dependencies
    cooldown:
      default-days: 7
    ignore:
      # The direct fontique only enables fontconfig-dlopen on Bevy's copy, so it follows Bevy.
      - dependency-name: fontique
        versions: ['>=0.12']
