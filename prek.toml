[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-case-conflict" },
  { id = "destroyed-symlinks" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-yaml" },
  { id = "check-added-large-files", exclude = '^docs/assets/montage\.webp$' },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
  { id = "pretty-format-json", args = ["--autofix"] },
  { id = "mixed-line-ending", args = ["--fix=lf"] },
]

[[repos]]
repo = "local"
hooks = [
  {
    id = "release-workflow",
    name = "Release workflow tests",
    entry = "uv run --script tests/test_release_workflow.py",
    language = "system",
    files = '^(tests/test_release_workflow\.py|\.github/workflows/release\.yml|about\.hbs|Cargo\.lock)$',
    pass_filenames = false,
  },
  {
    id = "changelog",
    name = "Changelog tests",
    entry = "uv run --script tests/test_changelog.py",
    language = "system",
    files = '^(scripts/changelog\.py|tests/test_changelog\.py|CHANGELOG\.md)$',
    pass_filenames = false,
  },
  {
    id = "icon-import",
    name = "Icon importer tests",
    entry = "uv run --script tests/test_import_icons.py",
    language = "system",
    files = '^(scripts/import_icon_mapping\.py|tests/test_import_icons\.py)$',
    pass_filenames = false,
  },
  {
    id = "ci-policy",
    name = "CI Rust input policy",
    entry = "uv run --script tests/test_ci_rust.py",
    language = "system",
    files = '(^scripts/ci_rust\.sh$|^tests/test_ci_rust\.py$|^\.github/workflows/ci\.yml$)',
    pass_filenames = false,
  },
  {
    id = "docs-logo",
    name = "Documentation logo matches root asset",
    entry = "bash scripts/check_docs_logo.sh",
    language = "system",
    files = '^(assets/codestrand\.svg|docs/assets/codestrand\.svg|scripts/check_docs_logo\.sh)$',
    pass_filenames = false,
  },
  {
    id = "docs-build",
    name = "Strict documentation build",
    entry = "uv run --locked --only-group docs zensical build --clean --strict",
    language = "system",
    files = '^(docs/|zensical\.toml$|pyproject\.toml$|uv\.lock$)',
    pass_filenames = false,
  },
  {
    id = "python-check",
    name = "Python lint",
    entry = "uvx ruff==0.17.3 check --target-version py315 --select E,F,I,UP,B,ANN",
    language = "system",
    types = ["python"],
  },
  {
    id = "python-format",
    name = "Python format",
    entry = "uvx ruff==0.17.3 format --target-version py315 --check",
    language = "system",
    types = ["python"],
  },
  {
    id = "cargo-fmt",
    name = "cargo fmt",
    entry = "cargo fmt --all -- --check",
    language = "system",
    files = '(\.rs$|(^|/)(Cargo\.toml|rustfmt\.toml|rust-toolchain\.toml)$)',
    pass_filenames = false,
  },
  {
    id = "clippy-enforce",
    name = "cargo clippy (enforce warnings)",
    entry = "cargo clippy --locked --all-targets --all-features -- -D warnings",
    language = "system",
    files = '(\.rs$|(^|/)(Cargo\.(toml|lock)|clippy\.toml|rust-toolchain\.toml)$|(^|/)\.cargo/config(\.toml)?$)',
    pass_filenames = false,
    require_serial = true,
  },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.3.2"
hooks = [{ id = "rumdl" }]

[[repos]]
repo = "https://github.com/owenlamont/ryl-pre-commit"
rev = "v0.29.0"
hooks = [
  { id = "ryl-check", args = ["--fix"] },
  { id = "ryl-check-markdown", args = ["--fix"] },
  { id = "ryl-format" },
  { id = "ryl-format-markdown" },
]

[[repos]]
repo = "https://github.com/adhtruong/mirrors-typos"
rev = "v1.52.0"
hooks = [{ id = "typos", args = ["--force-exclude"] }]

[[repos]]
repo = "https://github.com/woodruffw/zizmor-pre-commit"
rev = "v1.32.0"
hooks = [
  {
    id = "zizmor",
    args = ["--min-severity", "low", "--min-confidence", "medium", "--fix=safe"],
  },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "v1.7.12"
hooks = [{ id = "actionlint" }]

[[repos]]
repo = "local"
hooks = [
  {
    id = "npm-packages",
    name = "npm package builder tests",
    entry = "uv run --script tests/test_build_npm_packages.py",
    language = "system",
    files = '^(scripts/build_npm_packages\.py|tests/test_build_npm_packages\.py|npm-platforms\.json|package\.json|bin/codestrand\.js|\.github/workflows/release\.yml)$',
    pass_filenames = false,
  },
  {
    id = "npm-package-json-lint",
    name = "npm-package-json-lint",
    entry = "npx --yes npm-package-json-lint .",
    language = "system",
    files = '(^package\.json$|^\.npmpackagejsonlintrc\.json$)',
    pass_filenames = false,
  },
  {
    id = "publint",
    name = "publint",
    entry = "npx --yes publint",
    language = "system",
    files = '^package\.json$',
    pass_filenames = false,
  },
]

[[repos]]
repo = "https://github.com/owenlamont/lychee-pre-commit"
rev = "v0.24.2"
hooks = [
  {
    id = "lychee",
    args = ["--include-fragments", "--no-progress", "docs", "README.md", "CONTRIBUTING.md", "AGENTS.md"],
    always_run = true,
    pass_filenames = false,
  },
]
