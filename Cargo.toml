[package]
name = "codestrand"
version = "0.1.1"
edition = "2024"
rust-version = "1.99.1"
description = "A Git history visualiser with restrained 3D depth and animated diffs"
authors = ["Owen Lamont"]
readme = "README.md"
repository = "https://github.com/owenlamont/codestrand"
categories = ["visualization", "development-tools"]
keywords = ["git", "visualization", "history", "animation"]
license = "MIT OR Apache-2.0"
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/LICENSE-APACHE",
  "/THIRDPARTY.txt",
  "/README.md",
  "/assets/**",
  "/pyproject.toml",
  "/rust-toolchain.toml",
  "/src/**",
]

[dependencies]
anyhow = "1"
bevy = { version = "=0.20.1", default-features = false, features = [
    "default_app",
    "std",
    "multi_threaded",
    "bevy_winit",
    "x11",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_post_process",
    "bevy_ui_render",
    "default_font",
    "png",
] }
clap = { version = "4", features = ["derive"] }
dirs = "7"
gix = { version = "=0.90.0", default-features = false, features = ["basic", "max-performance", "sha1"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
resvg = { version = "=0.49.0", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "_ring", "platform-verifier"] }
sha2 = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif"] }
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"

[profile.dev]
debug = 0

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
