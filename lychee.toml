include_verbatim = false
max_retries = 3
retry_wait_time = 2
timeout = 30
max_concurrency = 16
accept = ["200..=299", "429", "503"]
exclude = [
  '^https?://(localhost|127\.0\.0\.1|0\.0\.0\.0)([:/]|$)',
  # The initial deployment requires Owen's account; local docs links remain checked.
  '^https://codestrand-docs\.pages\.dev(/|$)',
]
